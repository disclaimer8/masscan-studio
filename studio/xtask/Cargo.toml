[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
studio-platform.workspace = true
studio-protocol.workspace = true
rmasscan-core.workspace = true
rmasscan-net.workspace = true
rmasscan-engine.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_SystemServices"] }

[target.'cfg(target_os = "macos")'.dependencies]
studio-store.workspace = true
studio-app.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
rusqlite = { version = "=0.41.0", default-features = false }
