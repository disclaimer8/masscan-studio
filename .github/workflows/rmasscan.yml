# CI порта masscan на Rust (этапы 0-2B: core, cli, engine, net): fmt, clippy, тесты, правило «без C».
# Raw-сокеты, сеть и повышение прав не используются: тесты, открывающие AF_PACKET, помечены #[ignore]
# и идут только в замкнутом стенде (wire-lab.sh). На macOS и Windows crate net проверяется как
# сборка (open_explicit возвращает UnsupportedPlatform), а не как сырой ввод-вывод.
name: rmasscan

on:
  push:
    paths:
      - "rmasscan/**"
      - ".github/workflows/rmasscan.yml"
  pull_request:
    paths:
      - "rmasscan/**"
      - ".github/workflows/rmasscan.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    defaults:
      run:
        shell: bash
        working-directory: rmasscan
    steps:
      - uses: actions/checkout@v4

      # Все шаги идут в bash на всех ОС (`defaults.run.shell: bash`; на Windows
      # это Git Bash), так что поведение команд одинаково на трёх ОС.
      - name: Установить toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustc --version
          cargo --version

      - name: Кеш cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rmasscan/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rmasscan/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Формат
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # --workspace покрывает core, cli, engine и net (будущие члены тоже). Включает
      # no_c_in_build: граф всего workspace, включая sha2 движка и libc net, на трёх ОС.
      - name: Тесты
        run: cargo test --locked --workspace

      # Crate net отдельно: офлайн-тесты Linux-шва и независимого pcap-сравнения, example
      # лабораторного harness собирается на всех ОС. Ignored-тесты стенда НЕ запускаются.
      - name: Net crate (офлайн) и сборка лабораторного harness
        run: |
          cargo test --locked -p rmasscan-net
          cargo build --locked -p rmasscan-net --example wire_scan

      - name: Установить cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      - name: cargo deny
        run: cargo deny check bans licenses sources
