[package]
name = "rmasscan-net"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

# Единственный crate, где допускается unsafe (FFI к libc). Он намеренно НЕ
# наследует workspace-линт `unsafe_code = "forbid"`: lib.rs ставит
# `deny(unsafe_code)`, а private-модуль linux::socket разрешает unsafe локально.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
rmasscan-core = { path = "../rmasscan-core" }
rmasscan-engine = { path = "../rmasscan-engine" }
thiserror.workspace = true
sha2.workspace = true

# Только объявления FFI системной libc; C не компилируется (build.rs libc лишь
# выбирает cfg). Версия уже закреплена в Cargo.lock.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

# Windows: точечные объявления LoadLibraryExW/GetProcAddress и т.п. без
# build.rs и без import-библиотек Npcap (системные DLL, Rust raw-dylib). Это
# решение плана вместо libloading. Версия уже в Cargo.lock через другие crates.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Wdk_System_SystemServices",
] }

# Только живые тесты: проверка MAC лабораторного NIC (GetAdaptersAddresses) до
# любой отправки. Тот же windows-sys, дополнительные модули не входят в продукт.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
