[workspace]
resolver = "3"
members = ["crates/rmasscan-core", "crates/rmasscan-cli", "crates/rmasscan-engine"]

[workspace.package]
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
siphasher = "=1.0.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
proptest = "=1.12.0"

# Golden tests stream millions of BlackRock rounds; keep assertions on.
[profile.test]
opt-level = 1
